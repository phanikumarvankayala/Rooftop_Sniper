<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tic-Tac-Toe · Game Zone</title>
<meta name="description" content="Tic-tac-toe against the computer (easy, medium or unbeatable) or with a friend on the same device.">
<meta name="theme-color" content="#10151d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151d;--panel:#1a212c;--panel2:#232c39;--line:#2f3a4a;--txt:#eef2f7;--mut:#94a3b8;--acc:#7c5cff;--good:#3ddc84;--bad:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 28px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.home{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-family:Oswald,sans-serif;font-size:24px;letter-spacing:1px;margin:0;line-height:1.1}
.ttl small{color:var(--mut);font-size:12.5px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px}
.seg button.on{background:var(--acc);color:#fff}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools button,.btn{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 6px;font-weight:600;font-size:14px}
.btn.pri,.tools button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4}
.rules{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#cbd5e1;line-height:1.55}
.rules b{color:var(--txt)}
.rules ul{margin:6px 0 0;padding-left:18px}
.msg{min-height:22px;text-align:center;color:var(--mut);font-size:14px;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px;max-width:340px;width:100%;text-align:center}
.card h2{font-family:Oswald,sans-serif;font-size:30px;margin:0 0 6px;letter-spacing:1px}
.card p{color:var(--mut);margin:0 0 16px;line-height:1.5}
.card .row{display:flex;gap:8px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.card{animation:pop .25s ease-out}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.score div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.score b{display:block;font-family:Oswald,sans-serif;font-size:26px}
.score span{font-size:12px;color:var(--mut)}
.score .x b{color:#ff6b8b}.score .o b{color:#4cc9f0}
.score div.turn{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1;max-width:420px;margin:0 auto}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;font-family:Oswald,sans-serif;font-size:min(22vw,110px);line-height:1;padding:0}
.cell:not(:disabled):active{background:var(--panel2)}
.cell.X{color:#ff6b8b}.cell.O{color:#4cc9f0}
.cell.win{background:#2b2350;border-color:var(--acc);animation:pulse .8s ease-in-out infinite alternate}
.cell:disabled{opacity:1;cursor:default}
.cell span{animation:pop .2s ease-out}
@keyframes pulse{to{transform:scale(1.04)}}
.opts{display:flex;gap:8px;margin-bottom:10px}
.opts .seg{flex:1;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html" aria-label="Home">⌂</a><div class="ttl"><h1>Tic-Tac-Toe</h1><small>Play the computer or a friend</small></div></div>
  <div class="seg" id="modeSeg"><button data-m="cpu" class="on">🤖 vs Computer</button><button data-m="friend">👥 vs Friend</button></div>
  <div class="opts" id="cpuOpts">
    <div class="seg" id="lvlSeg"><button data-l="easy">Easy</button><button data-l="medium" class="on">Medium</button><button data-l="hard">Unbeatable</button></div>
    <div class="seg" id="sideSeg" style="flex:.7"><button data-s="X" class="on">Play X</button><button data-s="O">Play O</button></div>
  </div>
  <div class="score"><div class="x" id="sx"><b id="scX">0</b><span id="lbX">You (X)</span></div><div><b id="scD">0</b><span>Draws</span></div><div class="o" id="so"><b id="scO">0</b><span id="lbO">Computer (O)</span></div></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="tools"><button id="newBtn" class="pri">↻ New round</button><button id="resetBtn">Reset scores</button></div>
  <div class="rules"><b>How to play:</b> take turns placing X and O. Get three in a row (across, down or diagonal) to win. X always goes first, and the starting player alternates each round.</div>
</div>
<div class="ov" id="winOv" hidden><div class="card"><h2 id="winT">Solved!</h2><p id="winP"></p><div class="row"><button class="btn" id="winClose">Close</button><button class="btn pri" id="winNext">New game</button></div></div></div>
<script>
var $ = function (s) { return document.querySelector(s); };
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var Timer = { t0: 0, acc: 0, run: false, id: 0, el: null,
  start: function (el) { this.el = el; this.acc = 0; this.t0 = Date.now(); this.run = true; this.tick(); clearInterval(this.id); var s = this; this.id = setInterval(function () { s.tick(); }, 500); },
  stop: function () { if (this.run) this.acc += (Date.now() - this.t0) / 1000; this.run = false; clearInterval(this.id); this.tick(); return this.acc; },
  secs: function () { return this.acc + (this.run ? (Date.now() - this.t0) / 1000 : 0); },
  tick: function () { if (this.el) this.el.textContent = '⏱ ' + fmt(this.secs()); } };
document.addEventListener('visibilitychange', function () { if (!Timer.el) return; if (document.hidden && Timer.run) { Timer.acc += (Date.now() - Timer.t0) / 1000; Timer.paused = true; Timer.run = false; } else if (!document.hidden && Timer.paused) { Timer.paused = false; Timer.t0 = Date.now(); Timer.run = true; } });
function showWin(title, text, onNext) { $('#winT').textContent = title; $('#winP').innerHTML = text; $('#winOv').hidden = false; $('#winNext').onclick = function () { $('#winOv').hidden = true; onNext(); }; }
$('#winClose').onclick = function () { $('#winOv').hidden = true; };
var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var st = { mode: 'cpu', lvl: 'medium', side: 'X', b: Array(9).fill(''), turn: 'X', over: false, first: 'X', score: { X: 0, O: 0, D: 0 } };
var saved = store('ttt_prefs'); if (saved) { st.mode = saved.mode || 'cpu'; st.lvl = saved.lvl || 'medium'; st.side = saved.side || 'X'; }
var cells = [];
for (var i = 0; i < 9; i++) { var c = document.createElement('button'); c.className = 'cell'; c.dataset.i = i; c.onclick = function () { play(+this.dataset.i, true); }; $('#grid').appendChild(c); cells.push(c); }
function winner(b) { for (var k = 0; k < 8; k++) { var l = LINES[k]; if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return { p: b[l[0]], line: l }; } return b.indexOf('') < 0 ? { p: 'D' } : null; }
function minimax(b, p, me) {
  var w = winner(b); if (w) return w.p === 'D' ? 0 : (w.p === me ? 10 : -10);
  var best = p === me ? -99 : 99;
  for (var i = 0; i < 9; i++) if (!b[i]) { b[i] = p; var v = minimax(b, p === 'X' ? 'O' : 'X', me); b[i] = ''; v += v > 0 ? -0.01 : v < 0 ? 0.01 : 0; best = p === me ? Math.max(best, v) : Math.min(best, v); }
  return best;
}
function cpuMove() {
  var me = st.side === 'X' ? 'O' : 'X', empty = [], i;
  for (i = 0; i < 9; i++) if (!st.b[i]) empty.push(i);
  var smart = st.lvl === 'hard' ? 1 : st.lvl === 'medium' ? 0.6 : 0.15;
  if (Math.random() > smart) return empty[Math.floor(Math.random() * empty.length)];
  var bestV = -99, opts = [];
  empty.forEach(function (i) { st.b[i] = me; var v = minimax(st.b, me === 'X' ? 'O' : 'X', me); st.b[i] = ''; if (v > bestV + 1e-9) { bestV = v; opts = [i]; } else if (Math.abs(v - bestV) < 1e-9) opts.push(i); });
  return opts[Math.floor(Math.random() * opts.length)];
}
function play(i, human) {
  if (st.over || st.b[i]) return;
  if (human && st.mode === 'cpu' && st.turn !== st.side) return;
  st.b[i] = st.turn; st.turn = st.turn === 'X' ? 'O' : 'X';
  var w = winner(st.b);
  if (w) { st.over = true; st.score[w.p]++; store('ttt_score_' + st.mode, st.score); }
  draw(w);
  if (!st.over && st.mode === 'cpu' && st.turn !== st.side) setTimeout(function () { play(cpuMove(), false); }, 420);
}
function draw(w) {
  for (var i = 0; i < 9; i++) { var c = cells[i], v = st.b[i]; c.className = 'cell' + (v ? ' ' + v : '') + (w && w.line && w.line.indexOf(i) >= 0 ? ' win' : ''); c.innerHTML = v ? '<span>' + (v === 'X' ? '✕' : '◯') + '</span>' : ''; c.disabled = !!v || st.over; }
  $('#scX').textContent = st.score.X; $('#scO').textContent = st.score.O; $('#scD').textContent = st.score.D;
  var cpu = st.mode === 'cpu';
  $('#lbX').textContent = cpu ? (st.side === 'X' ? 'You (X)' : 'Computer (X)') : 'Player X';
  $('#lbO').textContent = cpu ? (st.side === 'O' ? 'You (O)' : 'Computer (O)') : 'Player O';
  $('#sx').classList.toggle('turn', !st.over && st.turn === 'X'); $('#so').classList.toggle('turn', !st.over && st.turn === 'O');
  var m = '';
  if (w) {
    if (w.p === 'D') m = "It's a draw 🤝";
    else if (cpu) m = w.p === st.side ? 'You win! 🎉' : 'Computer wins 🤖';
    else m = 'Player ' + w.p + ' wins! 🎉';
  } else m = cpu ? (st.turn === st.side ? 'Your turn' : 'Computer is thinking…') : 'Player ' + st.turn + "'s turn";
  $('#msg').textContent = m;
}
function newRound() {
  st.b = Array(9).fill(''); st.over = false; st.turn = 'X'; draw(null);
  if (st.mode === 'cpu' && st.side === 'O') setTimeout(function () { play(cpuMove(), false); }, 450);
}
function loadScore() { st.score = store('ttt_score_' + st.mode) || { X: 0, O: 0, D: 0 }; }
function segs() {
  [['#modeSeg', 'm', 'mode'], ['#lvlSeg', 'l', 'lvl'], ['#sideSeg', 's', 'side']].forEach(function (a) {
    document.querySelectorAll(a[0] + ' button').forEach(function (b) {
      b.classList.toggle('on', b.dataset[a[1]] === st[a[2]]);
      b.onclick = function () { st[a[2]] = b.dataset[a[1]]; store('ttt_prefs', { mode: st.mode, lvl: st.lvl, side: st.side }); if (a[2] === 'mode') loadScore(); segs(); newRound(); };
    });
  });
  $('#cpuOpts').hidden = st.mode !== 'cpu';
}
$('#newBtn').onclick = newRound;
$('#resetBtn').onclick = function () { st.score = { X: 0, O: 0, D: 0 }; store('ttt_score_' + st.mode, st.score); draw(winner(st.b)); };
loadScore(); segs(); newRound();
</script>
</body>
</html>
