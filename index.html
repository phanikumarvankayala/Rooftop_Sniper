<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Zone</title>
<meta name="description" content="Browser games to play with friends: Rooftop Sniper and Chess Coach. Works on phone and desktop.">
<meta name="theme-color" content="#0d1a0f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#fff;background:#0d1a0f}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:url('bg.jpg') center 35% / cover no-repeat;
  padding:24px 20px calc(48px + env(safe-area-inset-bottom))}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 45%,rgba(4,14,6,.82) 80%,rgba(4,14,6,.95) 100%)}
@media (min-width:900px){body{justify-content:center;background-position:center 62%}
  body::before{background:linear-gradient(90deg,rgba(4,14,6,.1) 0%,rgba(4,14,6,.25) 40%,rgba(4,14,6,.85) 100%)}
  .wrap{margin-left:auto;margin-right:6vw}}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;text-align:center}
h1{font-family:Oswald,sans-serif;font-size:44px;letter-spacing:2px;margin:0;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.6)}
p{margin:10px 0 26px;color:#d9e6d6;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.btns{display:grid;gap:14px}
.game{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:18px;text-decoration:none;color:#fff;
  background:rgba(12,24,14,.55);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,background .15s}
.game:hover,.game:active{transform:translateY(-2px);background:rgba(20,40,22,.7)}
.ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none}
.sniper .ic{background:linear-gradient(135deg,#ff6b5a,#c4271b)}
.chess .ic{background:linear-gradient(135deg,#81b64c,#4d7a26);font-size:34px}
.game span{display:flex;flex-direction:column;text-align:left}
.game b{font-family:Oswald,sans-serif;font-size:24px;letter-spacing:1px}
.game small{color:#cfdccc;font-size:13px;margin-top:2px}
.go{margin-left:auto;font-size:22px;opacity:.8}
</style>
</head>
<body>
  <main class="wrap">
    <h1>GAME ZONE</h1>
    <p>Pick a game. Plays on your phone or computer.</p>
    <div class="btns">
      <a class="game sniper" href="sniper.html"><div class="ic">🎯</div><span><b>Rooftop Sniper</b><small>Hold the rooftop, take out snipers</small></span><div class="go">›</div></a>
      <a class="game chess" href="chess.html"><div class="ic">♞</div><span><b>Chess</b><small>Play legends, get coached after</small></span><div class="go">›</div></a>
    </div>
  </main>
</body>
</html>
