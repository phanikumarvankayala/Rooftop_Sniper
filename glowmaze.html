<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Glow Maze · Game Zone</title>
<meta name="description" content="An arcade maze chase: guide Glim through the maze, eat every spark and turn the tables on the beetles with power orbs.">
<meta name="theme-color" content="#10151d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151d;--panel:#1a212c;--panel2:#232c39;--line:#2f3a4a;--txt:#eef2f7;--mut:#94a3b8;--acc:#22c55e;--good:#3ddc84;--bad:#ff5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 28px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.home{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-family:Oswald,sans-serif;font-size:24px;letter-spacing:1px;margin:0;line-height:1.1}
.ttl small{color:var(--mut);font-size:12.5px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px}
.seg button.on{background:var(--acc);color:#fff}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools button,.btn{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 6px;font-weight:600;font-size:14px}
.btn.pri,.tools button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4}
.rules{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#cbd5e1;line-height:1.55}
.rules b{color:var(--txt)}
.rules ul{margin:6px 0 0;padding-left:18px}
.msg{min-height:22px;text-align:center;color:var(--mut);font-size:14px;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px;max-width:340px;width:100%;text-align:center}
.card h2{font-family:Oswald,sans-serif;font-size:30px;margin:0 0 6px;letter-spacing:1px}
.card p{color:var(--mut);margin:0 0 16px;line-height:1.5}
.card .row{display:flex;gap:8px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.card{animation:pop .25s ease-out}
.wrap{max-width:600px;padding-bottom:12px}
.hud{display:flex;justify-content:space-between;align-items:center;margin:0 auto 6px;font-weight:700;font-variant-numeric:tabular-nums}
.hud .lbl{font-size:10px;color:var(--mut);letter-spacing:1.2px;text-transform:uppercase;display:block}
.hud .v{font-family:Oswald,sans-serif;font-size:22px;line-height:1}
.lives{display:flex;gap:4px;align-items:center}
.lives i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9fff0,#2ee6a6 55%,#0f9f73);box-shadow:0 0 8px #2ee6a6}
.stage{position:relative;margin:0 auto;touch-action:none}
canvas{display:block;border-radius:12px;background:#05060f}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.72);border-radius:12px;text-align:center;padding:16px}
.ovl h2{font-family:Oswald,sans-serif;font-size:34px;margin:0 0 4px;letter-spacing:2px;color:#4ade80;text-shadow:0 0 18px rgba(74,222,128,.6)}
.ovl p{color:#cbd5e1;margin:4px 0 14px;font-size:14px;line-height:1.5}
.ovl .btn{flex:none;padding:12px 26px}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin:10px auto 0;user-select:none;-webkit-user-select:none}
.dpad button{border:1px solid var(--line);background:var(--panel);border-radius:14px;font-size:22px;touch-action:none}
.dpad button:active,.dpad button.on{background:var(--acc);color:#04130a}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.small{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html" aria-label="Home">⌂</a><div class="ttl"><h1>Glow Maze</h1><small>Eat every spark, dodge the beetles</small></div><button class="pill" id="pauseBtn" style="cursor:pointer">⏸</button></div>
  <div class="hud" id="hud"><div><span class="lbl">Score</span><span class="v" id="score">0</span></div><div style="text-align:center"><span class="lbl">Level</span><span class="v" id="level">1</span></div><div style="text-align:center"><span class="lbl">Best</span><span class="v" id="best">0</span></div><div class="lives" id="lives"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas>
    <div class="ovl" id="startOv"><h2>GLOW MAZE</h2><p>Guide <b>Glim</b> to eat every spark.<br>Grab a power orb to make the beetles flee, then eat them for bonus points.</p><button class="btn pri" id="startBtn">▶ Play</button></div>
    <div class="ovl" id="pauseOv" hidden><h2>PAUSED</h2><p></p><button class="btn pri" id="resumeBtn">▶ Resume</button></div>
    <div class="ovl" id="overOv" hidden><h2 id="overT">GAME OVER</h2><p id="overP"></p><button class="btn pri" id="againBtn">↻ Play again</button></div>
  </div>
  <div class="dpad" id="dpad"><button class="u" data-d="0">▲</button><button class="l" data-d="3">◀</button><button class="r" data-d="1">▶</button><button class="d" data-d="2">▼</button></div>
  <div class="small" id="ctrlHint">Swipe on the maze or use the arrows · Keyboard: arrow keys / WASD · P to pause</div>
</div>
<div class="ov" id="winOv" hidden><div class="card"><h2 id="winT">Solved!</h2><p id="winP"></p><div class="row"><button class="btn" id="winClose">Close</button><button class="btn pri" id="winNext">New game</button></div></div></div>
<script>
var $ = function (s) { return document.querySelector(s); };
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var Timer = { t0: 0, acc: 0, run: false, id: 0, el: null,
  start: function (el) { this.el = el; this.acc = 0; this.t0 = Date.now(); this.run = true; this.tick(); clearInterval(this.id); var s = this; this.id = setInterval(function () { s.tick(); }, 500); },
  stop: function () { if (this.run) this.acc += (Date.now() - this.t0) / 1000; this.run = false; clearInterval(this.id); this.tick(); return this.acc; },
  secs: function () { return this.acc + (this.run ? (Date.now() - this.t0) / 1000 : 0); },
  tick: function () { if (this.el) this.el.textContent = '⏱ ' + fmt(this.secs()); } };
document.addEventListener('visibilitychange', function () { if (!Timer.el) return; if (document.hidden && Timer.run) { Timer.acc += (Date.now() - Timer.t0) / 1000; Timer.paused = true; Timer.run = false; } else if (!document.hidden && Timer.paused) { Timer.paused = false; Timer.t0 = Date.now(); Timer.run = true; } });
function showWin(title, text, onNext) { $('#winT').textContent = title; $('#winP').innerHTML = text; $('#winOv').hidden = false; $('#winNext').onclick = function () { $('#winOv').hidden = true; onNext(); }; }
$('#winClose').onclick = function () { $('#winOv').hidden = true; };
var MAP = ["###################", "#o.......#.......o#", "#.##.###.#.###.##.#", "#.................#", "#.##.#.#####.#.##.#", "#....#...#...#....#", "####.### # ###.####", "####.#       #.####", "####.# ##-## #.####", "    .  #HHH#  .    ", "####.# ##### #.####", "####.#       #.####", "####.# ##### #.####", "#........#........#", "#.##.###.#.###.##.#", "#o.#.....P.....#.o#", "##.#.#.#####.#.#.##", "#....#...#...#....#", "#.######.#.######.#", "#.................#", "###################"];
var W = 19, H = 21, DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
var cv = $('#cv'), ctx = cv.getContext('2d'), T = 20, DPR = 1;
var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (!isTouch) { $('#dpad').hidden = true; $('#ctrlHint').textContent = 'Arrow keys / WASD to move · P to pause'; }
function fit() {
  var availW = Math.min(window.innerWidth - 24, 576), availH = window.innerHeight - 140 - (isTouch ? 190 : 20);
  T = Math.max(12, Math.floor(Math.min(availW / W, availH / H)));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * T * DPR; cv.height = H * T * DPR; cv.style.width = W * T + 'px'; cv.style.height = H * T + 'px';
  $('#stage').style.width = W * T + 'px'; $('#hud').style.width = W * T + 'px';
  drawMazeLayer();
}
window.addEventListener('resize', fit);
function tile(x, y) { if (y < 0 || y >= H) return '#'; x = (x + W) % W; return MAP[y][x]; }
function openFor(x, y, ghost, allowDoor) { var t = tile(x, y); if (t === '#') return false; if ((t === '-' || t === 'H') && !(ghost && allowDoor)) return false; return true; }
// ----- maze layer (pre-rendered) -----
var mazeCv = document.createElement('canvas'), mctx = mazeCv.getContext('2d');
function drawMazeLayer() {
  mazeCv.width = cv.width; mazeCv.height = cv.height; var c = mctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W * T, H * T);
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
    if (MAP[y][x] !== '#') continue;
    c.fillStyle = '#12123a'; c.fillRect(x * T, y * T, T, T);
  }
  c.strokeStyle = '#7c6cff'; c.lineWidth = Math.max(2, T / 8); c.lineCap = 'round'; c.shadowColor = '#7c6cff'; c.shadowBlur = T / 2.5;
  c.beginPath();
  var isW = function (x, y) { return x < 0 || x >= W || y < 0 || y >= H ? false : MAP[y][x] === '#'; };
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    if (!isW(x, y)) continue; var px = x * T, py = y * T, i = T * 0.18;
    if (y > 0 && !isW(x, y - 1)) { c.moveTo(px + (isW(x - 1, y) && !isW(x - 1, y - 1) ? 0 : i), py + i); c.lineTo(px + T - (isW(x + 1, y) && !isW(x + 1, y - 1) ? 0 : i), py + i); }
    if (y < H - 1 && !isW(x, y + 1)) { c.moveTo(px + (isW(x - 1, y) && !isW(x - 1, y + 1) ? 0 : i), py + T - i); c.lineTo(px + T - (isW(x + 1, y) && !isW(x + 1, y + 1) ? 0 : i), py + T - i); }
    if (x > 0 && !isW(x - 1, y)) { c.moveTo(px + i, py + (isW(x, y - 1) && !isW(x - 1, y - 1) ? 0 : i)); c.lineTo(px + i, py + T - (isW(x, y + 1) && !isW(x - 1, y + 1) ? 0 : i)); }
    if (x < W - 1 && !isW(x + 1, y)) { c.moveTo(px + T - i, py + (isW(x, y - 1) && !isW(x + 1, y - 1) ? 0 : i)); c.lineTo(px + T - i, py + T - (isW(x, y + 1) && !isW(x + 1, y + 1) ? 0 : i)); }
  }
  c.stroke(); c.shadowBlur = 0;
  // door
  c.fillStyle = '#f9a8d4'; c.fillRect(9 * T, 8 * T + T * 0.42, T, T * 0.16);
}
// ----- game state -----
var G = null, best = +(store('gm_best') || 0);
var BEETLES = [{ name: 'Rubi', col: '#ef4444', dark: '#991b1b', corner: [W - 2, -2] }, { name: 'Pinx', col: '#f472b6', dark: '#9d174d', corner: [1, -2] }, { name: 'Azul', col: '#38bdf8', dark: '#075985', corner: [W - 1, H + 1] }, { name: 'Ambr', col: '#fb923c', dark: '#9a3412', corner: [0, H + 1] }];
function newGame() { G = { score: 0, lives: 3, level: 1, extra: false }; newLevel(); }
function newLevel() {
  G.dots = {}; G.dotCount = 0;
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) { var t = MAP[y][x]; if (t === '.' || t === 'o') { G.dots[y * W + x] = t; G.dotCount++; } }
  G.eaten = 0; resetRound();
}
function resetRound() {
  G.p = { x: 9, y: 15, dir: 3, want: 3, prog: 0, moving: false, mouth: 0 };
  G.g = BEETLES.map(function (b, i) {
    var home = [[9, 7], [9, 9], [8, 9], [10, 9]][i];
    return { i: i, x: home[0], y: home[1], dir: i === 0 ? 3 : 0, prog: 0, state: i === 0 ? 'active' : 'house', release: [0, 2.5, 6, 10][i] * Math.max(0.4, 1 - (G.level - 1) * 0.12), t: 0 };
  });
  G.mode = 'scatter'; G.modeT = 0; G.modeIdx = 0; G.fright = 0; G.combo = 0; G.ready = 1.8; G.dying = 0; G.pops = []; G.time = 0;
}
var MODES = [7, 20, 7, 20, 5, 20, 5, 9999];
function speeds() { var l = Math.min(G.level, 8); return { p: 6.4 + l * 0.25, g: 5.8 + l * 0.3, fr: 3.6, eaten: 13, tunnel: 3.2 }; }
// ----- movement -----
function advance(e, speed, dt, chooser) {
  e.prog += speed * dt; var guard = 0;
  while (e.prog >= 1 && guard++ < 4) {
    e.x = (e.x + DX[e.dir] + W) % W; e.y += DY[e.dir]; e.prog -= 1;
    chooser(e);
    if (e.stop) { e.prog = 0; e.stop = false; break; }
  }
}
function playerChoose(p) {
  if (onDot(p.x, p.y)) {}
  if (p.want !== p.dir && openFor(p.x + DX[p.want], p.y + DY[p.want])) p.dir = p.want;
  if (!openFor(p.x + DX[p.dir], p.y + DY[p.dir])) { p.stop = true; p.moving = false; }
}
function onDot() {}
function reverse(e) { if (e.prog > 0) { e.x = (e.x + DX[e.dir] + W) % W; e.y += DY[e.dir]; e.prog = 1 - e.prog; } e.dir = (e.dir + 2) % 4; }
function targetFor(g) {
  var p = G.p, b = BEETLES[g.i];
  if (g.state === 'eaten') return [9, 9];
  if (g.state === 'leaving') return [9, 7];
  if (G.mode === 'scatter') return b.corner;
  if (g.i === 0) return [p.x, p.y];
  if (g.i === 1) return [p.x + DX[p.dir] * 4, p.y + DY[p.dir] * 4];
  if (g.i === 2) { var r = G.g[0], ax = p.x + DX[p.dir] * 2, ay = p.y + DY[p.dir] * 2; return [ax * 2 - r.x, ay * 2 - r.y]; }
  var d = Math.hypot(g.x - p.x, g.y - p.y); return d > 8 ? [p.x, p.y] : b.corner;
}
function ghostChoose(g) {
  if (g.state === 'eaten' && g.x === 9 && g.y === 9) { g.state = 'leaving'; }
  if (g.state === 'leaving' && g.x === 9 && g.y === 7) { g.state = 'active'; }
  var allowDoor = g.state === 'eaten' || g.state === 'leaving';
  var opts = [];
  for (var d = 0; d < 4; d++) {
    if (d === (g.dir + 2) % 4 && !allowDoor) continue;
    var nx = g.x + DX[d], ny = g.y + DY[d];
    if (!openFor(nx, ny, true, allowDoor)) continue;
    if (!allowDoor && (tile(nx, ny) === '-' || tile(nx, ny) === 'H')) continue;
    opts.push(d);
  }
  if (!opts.length) { g.dir = (g.dir + 2) % 4; return; }
  if (G.fright > 0 && g.state === 'active' && g.fr) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
  var tg = targetFor(g), bestD = 1e9, bd = opts[0];
  if (allowDoor) { // avoid oscillating: don't reverse unless it is the only way
    var nr = opts.filter(function (d) { return d !== (g.dir + 2) % 4; }); if (nr.length) opts = nr;
  }
  opts.forEach(function (d) { var nx = g.x + DX[d], ny = g.y + DY[d], dist = (nx - tg[0]) * (nx - tg[0]) + (ny - tg[1]) * (ny - tg[1]); if (dist < bestD) { bestD = dist; bd = d; } });
  g.dir = bd;
}
// ----- update -----
var last = 0, running = false, paused = false;
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (running && !paused) update(dt);
  render(now / 1000);
  requestAnimationFrame(loop);
}
function update(dt) {
  if (G.ready > 0) { G.ready -= dt; return; }
  if (G.dying > 0) { G.dying -= dt; if (G.dying <= 0) afterDeath(); return; }
  G.time += dt;
  var sp = speeds(), p = G.p;
  // modes
  if (G.fright > 0) { G.fright -= dt; if (G.fright <= 0) G.g.forEach(function (g) { g.fr = false; }); }
  else { G.modeT += dt; if (G.modeT > MODES[G.modeIdx]) { G.modeT = 0; G.modeIdx = Math.min(MODES.length - 1, G.modeIdx + 1); G.mode = G.modeIdx % 2 ? 'chase' : 'scatter'; G.g.forEach(function (g) { if (g.state === 'active') reverse(g); }); } }
  // player
  if (!p.moving) { if (openFor(p.x + DX[p.want], p.y + DY[p.want])) { p.dir = p.want; p.moving = true; } }
  else if (p.want === (p.dir + 2) % 4) { p.x = (p.x + DX[p.dir] + W) % W; p.y += DY[p.dir]; p.dir = p.want; p.prog = 1 - p.prog; }
  if (p.moving) { advance(p, tile(p.x, p.y) === ' ' && p.y === 9 ? sp.p * 0.9 : sp.p, dt, playerChoose); p.mouth += dt * 10; }
  eatAt(p.x + (p.prog > 0.5 && p.moving ? DX[p.dir] : 0), p.y + (p.prog > 0.5 && p.moving ? DY[p.dir] : 0));
  // ghosts
  G.g.forEach(function (g) {
    g.t += dt;
    if (g.state === 'house') { g.bob = Math.sin(g.t * 6) * 0.18; if (g.t >= g.release) { g.state = 'leaving'; g.bob = 0; } return; }
    var s = g.state === 'eaten' ? sp.eaten : g.fr ? sp.fr : (g.y === 9 && (g.x < 5 || g.x > 13)) ? sp.tunnel : sp.g;
    if (g.state === 'leaving') s = 4;
    if (g.state === 'leaving' && g.prog === 0 && g.x !== 9) { g.dir = g.x < 9 ? 1 : 3; }
    advance(g, s, dt, ghostChoose);
    if (g.state === 'leaving' && g.x === 9 && g.y === 9 && g.prog === 0) { g.dir = 0; }
  });
  // collisions
  var px = p.x + (p.moving ? DX[p.dir] * p.prog : 0), py = p.y + (p.moving ? DY[p.dir] * p.prog : 0);
  G.g.forEach(function (g) {
    if (g.state === 'house' || g.state === 'eaten') return;
    var gx = g.x + DX[g.dir] * g.prog, gy = g.y + DY[g.dir] * g.prog;
    var dx = Math.abs(gx - px); dx = Math.min(dx, W - dx);
    if (dx * dx + (gy - py) * (gy - py) < 0.45) {
      if (g.fr) { g.fr = false; g.state = 'eaten'; G.combo++; var pts = 100 * Math.pow(2, G.combo); addScore(pts); G.pops.push({ x: gx, y: gy, t: 0, txt: pts }); sfx('eat'); }
      else if (g.state === 'active' || g.state === 'leaving') { G.dying = 1.6; sfx('die'); }
    }
  });
  G.pops = G.pops.filter(function (q) { q.t += dt; return q.t < 1; });
}
function eatAt(x, y) {
  x = (x + W) % W; var k = y * W + x, d = G.dots[k]; if (!d) return;
  delete G.dots[k]; G.eaten++;
  if (d === '.') { addScore(10); sfx('dot'); }
  else { addScore(50); G.fright = Math.max(2, 7 - G.level * 0.7); G.combo = 0; G.g.forEach(function (g) { if (g.state === 'active') { g.fr = true; reverse(g); } }); sfx('power'); }
  // release house beetles faster as sparks are eaten
  G.g.forEach(function (g) { if (g.state === 'house') g.t += 0.15; });
  if (G.eaten >= G.dotCount) levelDone();
}
function addScore(n) {
  G.score += n;
  if (!G.extra && G.score >= 10000) { G.extra = true; G.lives++; sfx('power'); }
  if (G.score > best) { best = G.score; store('gm_best', best); }
  hud();
}
function levelDone() { running = false; sfx('win'); setTimeout(function () { G.level++; newLevel(); hud(); running = true; }, 1600); G.flash = 1.6; }

// ----- render -----

function drawGlim(x, y, p, t) {

function drawBeetle(x, y, g, t) {

  }

  var ex = DX[g.dir] * r * 0.12, ey = DY[g.dir] * r * 0.12;
  [-1, 1].forEach(function (s) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + s * r * 0.24, y - r * 0.55, r * 0.18, 0, 6.283); ctx.fill();

// ----- input -----

var sw = null;

$('#stage').addEventListener('pointerup', function () { sw = null; });
document.querySelectorAll('#dpad button').forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.preventDefault(); ensureAudio(); setWant(+b.dataset.d); }); });

function togglePause() { if (!running && !paused) return; paused = !paused; $('#pauseOv').hidden = !paused; $('#pauseBtn').textContent = paused ? '▶' : '⏸'; }
$('#pauseBtn').onclick = togglePause; $('#resumeBtn').onclick = togglePause;
document.addEventListener('visibilitychange', function () { if (document.hidden && running && !paused) togglePause(); });
// ----- sound -----
